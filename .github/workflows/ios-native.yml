# MedicareGuide iOS — native SwiftUI app (ios/). No web view.
# Push to ios-native: compile for the simulator and publish screenshots to branch ci-shots-ios.
# Signed archive + TestFlight upload runs from the shared HAKOYA iOS workflow (choij1104/TOXCARD: ios-hakoya-app.yml needs this repo public or a token).
name: iOS native build (MedicareGuide)
on:
  push:
    branches: [ios-native]
    paths: ["ios/**", ".github/workflows/ios-native.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios-native
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate
      - name: Compile for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project MedicareGuide.xcodeproj -scheme MedicareGuide \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/build.log" | grep -E '^(\*\*|.*error:)' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/build.log" || { grep -E 'error:' "$RUNNER_TEMP/build.log" | head -60; exit 1; }
      - name: Simulator screenshots
        run: |
          APP=$(find "$RUNNER_TEMP/dd" -name MedicareGuide.app -path '*iphonesimulator*' | head -1)
          DEV=$(xcrun simctl list devices available | grep -E 'iPhone 1[6-9] Pro Max \(' | head -1 | grep -oE '[0-9A-F-]{36}')
          [ -n "$DEV" ] || DEV=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun simctl launch "$DEV" com.hakoya.medicareguide; sleep 6
          xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/shots/0-notice.png"
          xcrun simctl spawn "$DEV" defaults write com.hakoya.medicareguide acceptedNotice -bool YES
          shot() { xcrun simctl terminate "$DEV" com.hakoya.medicareguide || true
                   xcrun simctl launch "$DEV" com.hakoya.medicareguide "${@:2}"; sleep 6
                   xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/shots/$1.png"; }
          shot 1-basics-ko -tab 0 -lang ko
          shot 2-compare-ko -tab 1 -lang ko
          shot 3-fit-ko -tab 2 -lang ko
          shot 4-help-en -tab 3 -lang en
          shot 5-contacts-ko -tab 4 -lang ko
          xcrun simctl ui "$DEV" appearance dark
          shot 6-basics-dark -tab 0 -lang en
      - name: Publish screenshots
        run: |
          cd "$RUNNER_TEMP/shots"
          git init -q && git checkout -q -b ci-shots-ios
          git add . && git -c user.name=ci -c user.email=ci@localhost commit -q -m "shots ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots-ios
